<header class="pk-topbar">
  <div class="tb-title">{{ pageTitle }}</div>
  <div class="tb-spacer"></div>

  <div class="pk-tb-search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14ZM20 20l-4-4"/>
    </svg>
    <input placeholder="Search…" [(ngModel)]="search" />
  </div>

  <a class="pk-icon-btn" routerLink="/notifications" title="Notifications">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 9a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9ZM13.7 20a2 2 0 0 1-3.4 0"/>
    </svg>
    <span class="dot" *ngIf="hasUnreadNotifications"></span>
  </a>

  <button class="pk-icon-btn" (click)="authService.logout()" title="Sign out">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3M15 16l4-4-4-4M19 12H9"/>
    </svg>
  </button>
</header>
