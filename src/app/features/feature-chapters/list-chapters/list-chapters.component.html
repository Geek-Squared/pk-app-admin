<div style="margin-top:28px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
    <h3 class="pk-section-title" style="margin:0">Chapters</h3>
    <button class="pk-btn pk-btn-primary pk-btn-sm" (click)="isCreate = true">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Add chapter
    </button>
  </div>

  <div class="pk-chat-empty" *ngIf="isLoading"><clr-spinner clrSmall clrAssertive></clr-spinner></div>

  <ng-container *ngIf="!isLoading">
    <div class="pk-grid-cards" *ngIf="chapters?.length > 0">
      <a class="pk-tile teal" *ngFor="let chapter of chapters; let i = index" [routerLink]="categoryId ? ['/interventions', 'view-intervention', interventionId, 'view-category', categoryId, 'view-chapter', chapter.id] : ['/interventions', 'view-intervention', interventionId, 'view-chapter', chapter.id]">
        <button class="pk-tile-menu-btn" type="button" (click)="toggleMenu($event, chapter)" aria-label="More actions">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
        </button>
        <div class="pk-tile-menu" *ngIf="openMenuId === chapter.id" (click)="$event.stopPropagation()">
          <button type="button" (click)="editChapter($event, chapter)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 4.5l3 3M4 20l1-4L17 4l3 3L8 19l-4 1Z"/></svg>
            Edit
          </button>
          <button type="button" class="danger" (click)="deleteChapter($event, chapter)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>
            Delete
          </button>
        </div>
        <div class="pk-tile-ico">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4ZM5 4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2"/></svg>
        </div>
        <h3>{{ chapter?.title }}</h3>
        <div class="pk-tile-meta">{{ chapter?.description }}</div>
      </a>
    </div>
    <div class="pk-chat-empty" *ngIf="!chapters?.length">
      <h3>No chapters yet</h3>
      <p>Add the first chapter to this intervention.</p>
      <button class="pk-btn pk-btn-primary pk-btn-sm" (click)="isCreate = true">Add chapter</button>
    </div>
  </ng-container>
</div>
<app-create-chapter *ngIf="isCreate" [interventionId]="interventionId" [categoryId]="categoryId" (closeModal)="isCreate = false"></app-create-chapter>
<app-update-chapter *ngIf="isUpdate" [chapter]="selectedChapter" (closeModal)="isUpdate = false"></app-update-chapter>
<app-delete-chapter *ngIf="isDelete" [chapterId]="selectedChapter?.id" (closeModal)="isDelete = false"></app-delete-chapter>
