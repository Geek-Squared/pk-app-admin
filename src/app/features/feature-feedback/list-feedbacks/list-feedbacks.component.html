<div class="card-header text-center">Feedback</div>
<br />

<div class="text-center" *ngIf="isLoading">
  <br /><br />
  <clr-spinner clrMedium clrAssertive></clr-spinner>
  <br /><br />
</div>

<clr-datagrid *ngIf="!isLoading">
  <clr-dg-column>Name</clr-dg-column>
  <clr-dg-column>Phone Number</clr-dg-column>
  <clr-dg-column>Created Date</clr-dg-column>
  <clr-dg-column>Message</clr-dg-column>

  <clr-dg-row *clrDgItems="let item of feedback">
    <clr-dg-cell>{{ item?.name }}</clr-dg-cell>
    <clr-dg-cell>{{ item?.phoneNumber }}</clr-dg-cell>
    <clr-dg-cell>{{ item?.createdDate | date }}</clr-dg-cell>
    <clr-dg-cell>{{ item?.message }}</clr-dg-cell>
  </clr-dg-row>

  <clr-dg-footer
    >{{ pagination.firstItem + 1 }} - {{ pagination.lastItem + 1 }} of
    {{ feedback?.length }} Feedback Messages
    <clr-dg-pagination
      #pagination
      [clrDgTotalItems]="feedback?.length"
    ></clr-dg-pagination
  ></clr-dg-footer>
</clr-datagrid>
