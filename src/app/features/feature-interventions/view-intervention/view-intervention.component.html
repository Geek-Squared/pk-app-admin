<ng-container *ngIf="intervention$ | async as intervention">
  <div class="pk-page pk-fade-in">
    <div class="pk-page-head pk-row between">
      <div>
        <h1>{{ intervention?.name }}</h1>
        <p>Manage chapters and content within this intervention.</p>
      </div>
      <button class="pk-btn pk-btn-outline" (click)="updateIntervention(intervention)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 4.5l3 3M4 20l1-4L17 4l3 3L8 19l-4 1Z"/></svg>
        Edit intervention
      </button>
    </div>
    <app-list-chapters [interventionId]="route.snapshot.paramMap.get('interventionId')"></app-list-chapters>

    <div style="margin-top:var(--section-gap)">
      <app-intervention-surveys [intervention]="intervention"></app-intervention-surveys>
    </div>
  </div>
  <app-update-intervention *ngIf="isUpdate" [intervention]="selectedIntervention" (closeModal)="isUpdate = false"></app-update-intervention>
</ng-container>
