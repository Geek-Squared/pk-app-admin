<div class="card-header">Messaging</div>

<ng-container *ngIf="chat$ | async as chat">
  <ng-container *ngIf="auth.user$ | async as user">
    <div #chatBox class="chat">
      <div
        class="msg animated zoomInUp"
        *ngFor="let msg of chat.messages; trackBy: trackByCreated"
      >
        <div class="user">
          <!--   <img
            [src]="msg.user?.photoURL || 'assets/unicorn.svg'"
            width="50px"
          /> -->
          <div>
            <strong class="tag is-dark">{{
              msg.user?.displayName || msg.user?.uid
            }}</strong>
          </div>

          <!--   <button
            *ngIf="chat.uid === user.uid || msg.uid === user.uid"
            class="button is-danger is-small"
            (click)="cs.deleteMessage(chat, msg)"
          >
            Delete
          </button> -->
        </div>

        <span>{{ msg.content }}</span>
      </div>
    </div>

    <div class="form">
      <textarea
        [(ngModel)]="newMsg"
        name="description"
        maxlength="100"
        cols="50"
        (keydown.enter)="submit(chat.id)"
        required
      ></textarea>
    </div>
  </ng-container>
</ng-container>
