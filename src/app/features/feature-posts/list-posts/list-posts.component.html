<div style="margin-top:28px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
    <h3 class="pk-section-title" style="margin:0">Posts & Lessons</h3>
    <button class="pk-btn pk-btn-primary pk-btn-sm" (click)="isCreate = true">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Add post
    </button>
  </div>

  <div class="pk-chat-empty" *ngIf="isLoading"><clr-spinner clrSmall clrAssertive></clr-spinner></div>

  <ng-container *ngIf="!isLoading">
    <div class="pk-tbl-wrap" *ngIf="posts?.length > 0">
      <div *ngFor="let post of posts" style="display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--border);transition:background .12s" [style.cursor]="'default'">
        <div style="width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;flex:none;background:#FBEAE5;color:#C25340">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h9A1.5 1.5 0 0 1 15 7.5v9A1.5 1.5 0 0 1 13.5 18h-9A1.5 1.5 0 0 1 3 16.5v-9ZM15 10l6-3v10l-6-3"/></svg>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14.5px;font-weight:600">{{ post?.title }}</div>
          <div style="font-size:12.5px;color:var(--text-3);margin-top:3px;display:flex;gap:10px">
            <span>Order: {{ post?.order }}</span>
            <span *ngIf="post?.videoUrl">· Has video</span>
            <span *ngIf="post?.audio">· Has audio</span>
          </div>
          <app-list-questions [postId]="post?.postId" [chapterId]="chapterId"></app-list-questions>
        </div>
        <div style="display:flex;gap:8px">
          <button class="pk-btn pk-btn-soft pk-btn-sm" (click)="updatePost(post)">Edit</button>
          <button class="pk-btn pk-btn-danger pk-btn-sm" (click)="deletePost(post)">Delete</button>
        </div>
      </div>
    </div>
    <div class="pk-chat-empty" *ngIf="!posts?.length">
      <h3>No posts yet</h3>
      <p>Add the first lesson or post to this chapter.</p>
      <button class="pk-btn pk-btn-primary pk-btn-sm" (click)="isCreate = true">Add post</button>
    </div>
  </ng-container>
</div>

<app-create-post *ngIf="isCreate" [chapterId]="chapterId" (closeModal)="isCreate = false"></app-create-post>
<app-update-post *ngIf="isUpdate" [post]="selectedPost" (closeModal)="isUpdate = false"></app-update-post>
<app-delete-post *ngIf="isDelete" [postId]="selectedPost?.postId" (closeModal)="isDelete = false"></app-delete-post>
