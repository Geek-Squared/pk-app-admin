<div class="card-header text-center">Referrals</div>
<br />

<div class="text-center" *ngIf="isLoading">
  <br /><br />
  <clr-spinner clrMedium clrAssertive></clr-spinner>
  <br /><br />
</div>

<ng-container *ngIf="!isLoading">
  <clr-button-group>
    <clr-button class="btn btn-sm" (click)="isCreate = true">
      <clr-icon shape="plus"></clr-icon>&nbsp;Create Referral
    </clr-button>
  </clr-button-group>
  <br />

  <clr-datagrid>
    <clr-dg-column>Name</clr-dg-column>
    <clr-dg-column>Phone Number</clr-dg-column>
    <clr-dg-column>Message</clr-dg-column>

    <clr-dg-row *clrDgItems="let item of referral">
      <clr-dg-action-overflow>
        <button class="action-item" (click)="updateReferral(item)">
          Update
        </button>
      </clr-dg-action-overflow>
      <clr-dg-cell>{{ item?.name }}</clr-dg-cell>
      <clr-dg-cell>{{ item?.phoneNumber }}</clr-dg-cell>
      <clr-dg-cell>{{ item?.address }}</clr-dg-cell>
    </clr-dg-row>

    <clr-dg-footer>{{ referral?.length }} Referrals</clr-dg-footer>
  </clr-datagrid>
</ng-container>

<app-create-referral
  *ngIf="isCreate"
  (closeModal)="isCreate = false"
></app-create-referral>

<app-update-referral
  *ngIf="isUpdate"
  [referral]="selectedReferral"
  (closeModal)="isUpdate = false"
></app-update-referral>
