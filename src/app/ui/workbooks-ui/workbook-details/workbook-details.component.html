<div class="pk-overlay">
  <div class="pk-modal" style="max-width:620px" (click)="$event.stopPropagation()">
    <div class="pk-modal-head">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h2>Workbook responses</h2>
        <button class="pk-icon-btn" (click)="closeModal.emit()" style="width:34px;height:34px;flex:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="pk-modal-body" style="padding-top:8px">
      <div *ngFor="let element of item?.content | keyvalue" style="padding:16px 0;border-bottom:1px solid var(--border)">
        <p style="font-size:14px;font-weight:600;color:var(--text);margin:0 0 8px">{{ element?.value?.questionNarrative }}</p>
        <p style="font-size:14px;color:var(--text-2);margin:0 0 6px;line-height:1.55">{{ element?.value?.response }}</p>
        <small style="font-size:12px;color:var(--text-3)">
          {{ getDetails(element?.value?.postId)?.chapterTitle }} · {{ getDetails(element?.value?.postId)?.postTitle }}
        </small>
      </div>
    </div>
    <div class="pk-modal-foot">
      <button class="pk-btn pk-btn-outline" (click)="closeModal.emit()">Close</button>
    </div>
  </div>
</div>
