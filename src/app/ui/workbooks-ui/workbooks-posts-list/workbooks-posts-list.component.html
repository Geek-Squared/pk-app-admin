<div class="clr-row">
  <div
    class="clr-col-lg-3 clr-col-12"
    *ngFor="let postId of postIds; let i = index"
  >
    <a class="card clickable text-center" (click)="viewSelected.emit(postId)">
      <div class="card-block">
        <clr-icon shape="book" class="is-info" size="32"></clr-icon>
        <p class="card-text">
          {{ getDetails(postId)?.chapterTitle }} :
          {{ getDetails(postId)?.postTitle }}
        </p>
      </div>
    </a>
  </div>
</div>
