<div class="workbook-sidebar">
  <div
    class="sidebar-item"
    *ngFor="let postId of postIds; let i = index"
    [class.active]="postId === activePostId"
    (click)="viewSelected.emit(postId)"
  >
    <div class="sidebar-item-content">
      <clr-icon shape="book"></clr-icon>
      <div class="sidebar-text">
        <span class="chapter-label">{{ getDetails(postId)?.chapterTitle }}</span>
        <span class="post-label">{{ getDetails(postId)?.postTitle }}</span>
      </div>
    </div>
  </div>
</div>
